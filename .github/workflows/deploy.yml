name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      
      - name: Install and run Vercel CLI
        run: |
          cd frontend
          npm i -g vercel@latest
          vercel --prod --token=${{ secrets.VERCEL_TOKEN }} --yes